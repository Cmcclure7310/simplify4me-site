<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simplify 4 Me</title><link rel="stylesheet" href="popup.css"></head><body><main class="shell"><header class="hero"><div class="brand-row"><div class="logo">S4</div><div><h1>Simplify 4 Me</h1><p>Make the web easier to read.</p></div><button id="settingsBtn" class="icon-btn" aria-label="Open settings">⚙</button></div><div id="pageStatus" class="status"><span class="dot"></span><span>Checking this page…</span></div></header><section class="actions-grid" aria-label="Reading tools"><button class="action-card primary" data-action="simplify"><span class="action-icon">✦</span><span><b>Simplify</b><small>Selected text</small></span><span class="arrow">→</span></button><button class="action-card" data-action="quick"><span class="action-icon">⚡</span><span><b>Quick Read</b><small>Clean page view</small></span><span class="arrow">→</span></button><button class="action-card" data-action="focus"><span class="action-icon">◎</span><span><b>Focus</b><small>Follow one block</small></span><span id="focusState" class="state">Off</span></button><button class="action-card" data-action="listen"><span class="action-icon">◖</span><span><b>Listen</b><small>Selection or page</small></span><span class="arrow">→</span></button></section><section class="panel"><div class="panel-head"><div><span class="eyebrow">SIMPLIFICATION</span><h2>How simple?</h2></div><span id="strengthLabel" class="badge">Clear</span></div><div class="segmented" role="radiogroup" aria-label="Simplification strength"><button data-strength="light">Light</button><button data-strength="clear">Clear</button><button data-strength="simple">Simple</button></div><p class="hint" id="strengthHint">Plain everyday language without over-changing the original.</p></section><section class="panel compact"><div class="toggle-row"><div><b>Complexity Lens</b><span>Underline difficult words</span></div><button id="lensToggle" class="switch" role="switch" aria-checked="false" aria-label="Toggle Complexity Lens"><span></span></button></div><div class="divider"></div><div class="toggle-row"><div><b>Always help on this site</b><span id="siteLabel">Remember this website</span></div><button id="siteToggle" class="switch" role="switch" aria-checked="false" aria-label="Always help on this site"><span></span></button></div></section><footer><span>Private by design • no account • no cloud AI</span><button id="helpBtn">Help</button></footer></main><script src="../shared/defaults.js"></script><script src="popup.js"></script></body></html>
